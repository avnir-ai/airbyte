version: "0.29.0"

definitions:
  schema_loader:
    file_path: "./source_posthog/schemas/{{ parameters['name'] }}.json"

  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: ["results"]

  requester:
    type: HttpRequester
    url_base: "{{ config['base_url'] or 'https://app.posthog.com'}}/api/"
    path: "/projects/{{ config['project_id'] }}/{{ parameters['name'] }}"
    http_method: "GET"
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_key'] }}"

  retriever:
    type: SimpleRetriever
    record_selector:
      $ref: "#/definitions/selector"
    paginator:
      type: "DefaultPaginator"
      page_size_option:
        inject_into: "request_parameter"
        field_name: "limit"
      pagination_strategy:
        type: "OffsetIncrement"
        page_size: 100
      page_token_option:
        type: RequestOption
        field_name: "offset"
        inject_into: "request_parameter"

  base_stream:
    primary_key: "id"
    schema_loader:
      $ref: "#/definitions/schema_loader"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"

  projects_stream:
    $ref: "#/definitions/base_stream"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        path: "projects/{{ config['project_id'] }}"
    $parameters:
      name: "projects"
      path: "projects"

  cohorts_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "cohorts"
      path: "cohorts"

  feature_flags_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "feature_flags"
      path: "feature_flags"

  persons_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "persons"
      path: "persons"

  annotations_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "annotations"
      path: "annotations"

  insights_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "insights"
      path: "insights"

  events_stream:
    $parameters:
      name: "events"
      path: "events"
    primary_key: "id"
    incremental_sync:
      type: DatetimeBasedCursor
      start_datetime:
        datetime: "{{ config['start_date'] }}"
        datetime_format: "%Y-%m-%dT%H:%M:%S%z"
      end_datetime:
        datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%S%z') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%S%z"
      datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.%f%z"
        - "%Y-%m-%dT%H:%M:%S+00:00"
      cursor_granularity: "PT0.000001S"
      step: "P{{ config.get('events_time_step', 30) }}D"
      cursor_field: timestamp
      start_time_option:
        field_name: after
        inject_into: request_parameter
      end_time_option:
        field_name: before
        inject_into: request_parameter
    schema_loader:
      $ref: "#/definitions/schema_loader"
    retriever:
      type: CustomRetriever
      class_name: "source_posthog.components.EventsSimpleRetriever"
      record_selector:
        $ref: "#/definitions/selector"
        # CustomRetriever factory-gap boilerplate: create_custom_component() does not
        # replicate create_simple_retriever()'s kwargs wiring, so record_selector needs
        # its transformations supplied explicitly via $parameters. An empty list ([]) is
        # silently dropped by a ManifestComponentTransformer propagation quirk
        # (manifest_component_transformer.py:130-138), so use an empty string instead
        # (iterates zero times — same effect, but survives the transform).
        $parameters:
          transformations: ""
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ config['project_id'] }}/{{ parameters['name'] }}/"
      paginator:
        type: "DefaultPaginator"
        # Same CustomRetriever factory-gap boilerplate: the paginator needs url_base
        # supplied via $parameters because create_custom_component() doesn't wire it in
        # the way create_simple_retriever() does for a stock SimpleRetriever.
        $parameters:
          url_base: "{{ config['base_url'] or 'https://app.posthog.com'}}/api/"
        page_size_option:
          inject_into: "request_parameter"
          field_name: "limit"
        pagination_strategy:
          type: "CursorPagination"
          cursor_value: "{{ response['next'] }}"
          page_size: 10000
        page_token_option:
          type: RequestPath

streams:
  - "#/definitions/cohorts_stream"
  - "#/definitions/feature_flags_stream"
  - "#/definitions/persons_stream"
  - "#/definitions/events_stream"
  - "#/definitions/annotations_stream"
  - "#/definitions/insights_stream"

check:
  type: CheckStream
  stream_names: ["cohorts"]
